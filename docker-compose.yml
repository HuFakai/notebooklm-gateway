services:
  gateway:
    build: .
    image: notebooklm-gateway:latest
    container_name: notebooklm-gateway-server
    ports:
      - "${GATEWAY_PORT:-18388}:18388"
    volumes:
      - ./data:/app/data
    environment:
      GATEWAY_ADMIN_TOKEN: ${GATEWAY_ADMIN_TOKEN:?请在 .env 中设置强随机管理令牌}
      GATEWAY_CORS_ORIGINS: ${GATEWAY_CORS_ORIGINS:-}
      GATEWAY_MAX_CLIENTS: ${GATEWAY_MAX_CLIENTS:-20}
      GATEWAY_CLIENT_IDLE_SECONDS: ${GATEWAY_CLIENT_IDLE_SECONDS:-1800}
      GATEWAY_KEEPALIVE_SECONDS: ${GATEWAY_KEEPALIVE_SECONDS:-600}
      GATEWAY_MAX_UPLOAD_BYTES: ${GATEWAY_MAX_UPLOAD_BYTES:-104857600}
    restart: unless-stopped
